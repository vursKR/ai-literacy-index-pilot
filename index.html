<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>
const DATA_ENDPOINT = 'https://script.google.com/macros/s/AKfycbxPxX_goXJdn5cbksMyg36f2VZLIhnZkLuCSkD2QZ0HRi3jjwsLRaKW3-keTRJSOTgz/exec';
const CONTACT_EMAIL = 'mike@eduwill.net';
const PILOT_END = '2026-12-31';
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05060B">
<title>AI 활용 지수 시범판</title>
<meta name="description" content="10문항에 답하면 다섯 영역 AI 활용 점수, 한국 직장인 가운데 내 위치, 다음 한 달에 해 볼 일을 받습니다.">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/static/pretendard.min.css">
<style>
/* 디자인 토큰: 한 색에 한 뜻. Key = 지금 누를 것과 고른 것, Sub = 내 데이터와 정답, 흰 점선 = 한국 평균 */
:root{
 --bg:#05060B;--s1:#0C0D16;--s2:#151727;--line:#23253A;--ctl:#5F6285;
 --tx:#F4F4F8;--mu:#9496AE;--key:#6A55F5;--key-h:#7A67FF;--key2:#8B7BFF;--keyt:rgba(106,85,245,.18);
 --sub:#6EE7F9;--subt:rgba(110,231,249,.10);--err:#FCA5A5;
 --f1:12px;--f2:14px;--f3:16px;--f4:20px;--f5:24px;--f6:32px;
 --r1:8px;--r2:12px;--r3:16px;--rp:999px
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;font-size:var(--f3);line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:inherit}
:focus-visible{outline:2px solid var(--key2);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fine{font-size:var(--f2);color:var(--mu);margin:12px 0 0}
.demo{background:var(--key);color:#fff;text-align:center;font-size:13px;font-weight:700;padding:6px 16px}

/* 머리와 진행선 */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 24px}
.brand{font-weight:800;font-size:var(--f2);letter-spacing:-.01em;background:none;border:0;padding:8px 0;color:var(--tx);cursor:pointer}
.brand:hover{text-decoration:underline;text-underline-offset:4px}
.brand span{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--mu);border:1px solid var(--ctl);border-radius:var(--r1);padding:0 6px;vertical-align:1px}
.ptxt{font-size:13px;color:var(--mu);font-variant-numeric:tabular-nums}
.tr{display:flex;align-items:center;gap:14px}
.mtog{background:none;border:0;padding:8px 0;color:var(--mu);font-size:13px;text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}
.mtog:hover{color:var(--tx)}
.pline{height:2px;background:var(--line);margin:0 24px}
.pline i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--key2) 0%,#C4BAFF 50%,var(--key2) 100%);background-size:200% 100%;animation:flowx 2.8s linear infinite;transition:width .6s ease}
@keyframes flowx{to{background-position:-200% 0}}

/* 무대 */
.shell{display:grid;grid-template-columns:minmax(0,1fr);min-height:calc(100vh - 60px)}
.stage{width:100%;max-width:680px;margin:0 auto;padding:8px 20px 56px;text-align:center}
.stage[data-view=result]{max-width:760px}
.stage[data-view=dash]{max-width:920px}
.slot{width:240px;height:240px;margin:0 auto;transition:width .5s ease,height .5s ease}
[data-view=prep] .slot{width:120px;height:120px}
[data-view=domain] .slot{width:200px;height:200px}
[data-view=q] .slot{width:112px;height:112px}
[data-view=result] .slot{width:112px;height:112px}
[data-view=dash] .slot{width:96px;height:96px}
canvas.orb{display:block;width:100%;height:100%}
.back{display:block;margin:0 auto 6px;background:none;border:0;color:var(--mu);font-size:var(--f2);cursor:pointer;padding:6px 8px}
.back:hover{color:var(--tx)}
.eyebrow{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 8px;font-size:13px;font-weight:700;color:var(--key2);letter-spacing:.02em;margin:0 0 10px}
.tag{font-size:var(--f1);font-weight:800;border-radius:var(--r1);padding:1px 8px;background:var(--s2);color:var(--tx);border:1px solid var(--line)}
.tag.up{color:var(--key2);border-color:var(--key2)}
.say{font-size:var(--f6);line-height:1.32;font-weight:700;letter-spacing:-.02em;margin:0;min-height:1.3em}
[data-view=q] .say{font-size:var(--f5);line-height:1.45}
.say:focus{outline:none}
.say .cur{display:inline-block;width:.08em;height:1em;background:var(--key2);margin-left:2px;vertical-align:-.12em;animation:bl 1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
.sub{color:var(--mu);margin:12px auto 0;max-width:34em}
.body{margin:28px 0 0;text-align:left}
.after{opacity:0;transform:translateY(8px);transition:opacity .45s ease,transform .45s ease}
.after:not(.on){visibility:hidden}
.after.on{opacity:1;transform:none}
.center{text-align:center}
@media (max-width:600px){
 .top{padding:12px 16px}.pline{margin:0 16px}.stage{padding:4px 16px 48px}
 .slot{width:180px;height:180px}
 [data-view=prep] .slot{width:96px;height:96px}[data-view=domain] .slot{width:150px;height:150px}
 [data-view=q] .slot,[data-view=result] .slot{width:84px;height:84px}[data-view=dash] .slot{width:72px;height:72px}
 .say{font-size:var(--f5)}[data-view=q] .say{font-size:var(--f4)}
}

/* 누르는 모양은 넷: 주 버튼 · 보조 버튼 · 선택지 · 글자 링크 */
.pri{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--key);color:#fff;border:0;border-radius:var(--r2);min-height:52px;padding:0 28px;font-size:17px;font-weight:700;cursor:pointer;transition:background .15s}
.pri:hover{background:var(--key-h)}
.sec{display:inline-flex;align-items:center;justify-content:center;background:transparent;color:var(--tx);border:1.5px solid var(--ctl);border-radius:var(--r2);min-height:48px;padding:0 20px;font-size:15px;font-weight:600;cursor:pointer}
.sec:hover{border-color:var(--tx)}
.lnk{background:none;border:0;padding:8px 4px;color:var(--tx);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:var(--f2)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chip{border:1px solid var(--ctl);background:transparent;color:var(--tx);border-radius:var(--rp);min-height:44px;padding:8px 18px;font-size:15px;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--key2)}
.chip[aria-pressed=true]{background:var(--keyt);border-color:var(--key2);font-weight:700}
.chip[aria-pressed=true]::before{content:"✓ ";color:var(--key2)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ctl);color:var(--tx);border-radius:var(--r2);padding:14px 16px;margin:0 0 10px;font-size:var(--f3);line-height:1.5;cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--key2);background:var(--s2)}
.opt .k{flex:0 0 26px;height:26px;border:1px solid var(--ctl);border-radius:7px;display:grid;place-items:center;font-size:var(--f1);font-weight:800;color:var(--mu)}
div.opt{cursor:default}
.opt.ok{border:2px solid var(--sub);background:var(--subt)}
.opt.ok .k{background:var(--sub);border-color:var(--sub);color:var(--bg)}
.opt.no{border-style:dashed;background:transparent}
.opt em{font-style:normal;display:inline-block;font-size:var(--f1);font-weight:800;border-radius:6px;padding:0 8px;margin-left:8px;vertical-align:1px}
.opt.ok em{background:var(--sub);color:var(--bg)}
.opt.no em{border:1px solid var(--ctl);color:var(--mu)}
.idk{background:none;border:0;color:var(--mu);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:var(--f2);padding:8px 0}
.idk:hover{color:var(--tx)}
.term{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:help;text-decoration:underline dotted;text-underline-offset:4px;text-decoration-thickness:1.5px}
#tip{position:absolute;z-index:50;max-width:min(320px,calc(100vw - 32px));background:var(--s2);color:var(--tx);border:1px solid var(--key2);border-radius:var(--r2);padding:10px 14px;font-size:var(--f2);text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#tip b{color:var(--key2);display:block}

/* 준비 */
.agree{display:flex;gap:12px;align-items:flex-start;cursor:pointer;margin:0 0 14px;font-size:15px}
.agree input{width:22px;height:22px;margin:1px 0 0;accent-color:var(--key);flex:0 0 auto}
details.more{font-size:var(--f2);color:var(--mu);margin:0 0 22px}
details.more summary{cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
details.more p{margin:8px 0 0}
.err{color:var(--err);font-size:var(--f2);margin:10px 0 0}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
.joined{font-size:var(--f2);color:var(--mu);margin:28px 0 0}
.joined b{color:var(--tx);font-variant-numeric:tabular-nums}
.joined .bar{display:inline-block;width:1px;height:11px;background:var(--ctl);margin:0 10px;vertical-align:-1px}

/* 문항 */
.qctx{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;font-size:15px;white-space:pre-line;margin:0 0 14px}
.convo{border:1px dashed var(--ctl);border-radius:var(--r3);padding:12px;margin:0 0 14px;display:grid;gap:8px}
.convo .ch{font-size:var(--f1);font-weight:700;color:var(--mu)}
.bub{max-width:88%;padding:10px 14px;border-radius:var(--r3);font-size:15px;line-height:1.55;white-space:pre-line}
.bub.u{justify-self:end;background:var(--keyt);border:1px solid rgba(139,123,255,.4);border-bottom-right-radius:4px}
.bub.ai{background:var(--s2);border-top-left-radius:4px;min-height:40px}
.dots{display:inline-flex;gap:4px;padding:6px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mu);animation:dot 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{opacity:.25}30%{opacity:1}}
.copt-h{font-size:13px;font-weight:700;color:var(--mu);margin:4px 0 8px}
.repro{display:grid;gap:10px;margin:0 0 8px}
@media (min-width:700px){.repro{grid-template-columns:.85fr 1.15fr}}
.rbox{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.rh{padding:8px 12px;font-size:var(--f1);font-weight:700;color:var(--mu);border-bottom:1px solid var(--line)}
.repro table{width:100%;border-collapse:collapse;font-size:var(--f2);font-variant-numeric:tabular-nums}
.repro th,.repro td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:right;font-weight:400}
.repro th[scope=row],.repro thead th:first-child{text-align:left}
.repro thead th{font-size:var(--f1);color:var(--mu);font-weight:700}
.repro tbody tr:last-child>*{border-bottom:0;font-weight:700}
.repro tr.hit>*{background:var(--subt);color:var(--sub);font-weight:800}
.repro ul{margin:0;padding:10px 12px 10px 28px;font-size:15px;line-height:2.25}
.num{display:inline-block;border:1px solid var(--ctl);background:var(--s2);color:var(--tx);padding:0 8px;border-radius:7px;font-variant-numeric:tabular-nums;font-weight:700;line-height:1.75;min-width:40px;text-align:center}
button.num{cursor:pointer}
button.num:hover{border-color:var(--key2);background:var(--keyt)}
.num.ok{background:var(--sub);color:var(--bg);border-color:var(--sub)}
.num.no{text-decoration:line-through;color:var(--mu)}
.ex{background:var(--s1);border-left:3px solid var(--sub);border-radius:0;padding:12px 14px;margin:14px 0 20px;font-size:15px}
.ex b{color:var(--sub);margin-right:6px}

/* 진행 레일: 넓은 화면에서만 */
.rail{display:none}
@media (min-width:1024px){
 .shell.rail-on{grid-template-columns:260px minmax(0,1fr)}
 .shell.rail-on .rail{display:block;position:sticky;top:0;align-self:start;padding:28px 20px 28px 24px}
}
.rl{font-size:var(--f1);font-weight:700;color:var(--mu);margin:0 0 8px;letter-spacing:.04em}
.rsteps{list-style:none;margin:0 0 18px;padding:0;display:grid;gap:4px;font-size:var(--f2)}
.rsteps li{position:relative;display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;padding:7px 10px;border-radius:var(--r2);color:var(--mu)}
.rsteps li b{width:26px;height:26px;border-radius:7px;border:1px solid var(--ctl);display:grid;place-items:center;font-size:var(--f1)}
.rsteps li em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums;color:var(--mu)}
.rsteps li.now{background:linear-gradient(100deg,var(--s1) 38%,rgba(139,123,255,.2) 50%,var(--s1) 62%);background-size:260% 100%;animation:sweep 4s ease-in-out infinite;color:var(--tx);font-weight:700}
@keyframes sweep{from{background-position:110% 0}to{background-position:-10% 0}}
.rsteps li.now b{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 5px var(--keyt),0 0 14px rgba(139,123,255,.55)}}
.rsteps li.now b{background:var(--key);border-color:var(--key);color:#fff}
.rsteps li.done b{color:var(--sub);border-color:var(--sub)}
.rsteps li.done em{color:var(--sub)}
.rsteps li.plus::after{content:"+";position:absolute;right:2px;top:-4px;font-weight:800;color:var(--sub);animation:plus .9s ease-out forwards}
@keyframes plus{from{opacity:1;transform:translateY(4px)}to{opacity:0;transform:translateY(-12px)}}
.rcap{font-size:var(--f1);color:var(--mu);margin:6px 0 0}

/* 역량 지형 */
.map{display:block;width:100%;height:auto;overflow:visible}
.hill,.wob{transform-box:view-box}
.hill{transition:transform 1s cubic-bezier(.2,.8,.2,1)}
.wob{animation:wob 5.5s ease-in-out infinite alternate}
@keyframes wob{from{transform:scaleY(.96)}to{transform:scaleY(1.04)}}
.mist{transform-box:fill-box;transform-origin:50% 50%;animation:mist 6s ease-in-out infinite alternate}
@keyframes mist{to{transform:translateX(4px) scale(1.07)}}
.fog{transition:opacity .9s ease}
.avg{clip-path:inset(0 100% 0 0);transition:clip-path 1.2s ease}
.avg.on{clip-path:inset(0 0 0 0)}

/* 결과 */
.rs{margin:0 0 34px}
.sh{display:flex;align-items:center;gap:10px;font-size:var(--f4);line-height:1.35;margin:0 0 14px}
.sh span{flex:0 0 26px;height:26px;border-radius:50%;border:1px solid var(--key2);color:var(--key2);display:grid;place-items:center;font-size:13px;font-weight:800}
.rmap{max-width:560px;margin:0 auto}
.mscore{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:2px 5.9% 0;text-align:center;gap:4px}
.mscore b{display:block;font-size:var(--f5);line-height:1.15;font-weight:800;font-variant-numeric:tabular-nums;color:var(--sub)}
.mscore div>span{display:block;font-size:var(--f1);line-height:1.3;margin-top:2px}
.mscore small{display:block;font-size:var(--f1);color:var(--mu);margin-top:2px}
.leg{font-size:13px;color:var(--mu);text-align:center;margin:10px 0 0}
.leg i{display:inline-block;width:18px;border-top:2px dashed var(--tx);vertical-align:4px;margin-right:6px}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.kpis{grid-template-columns:1fr}}
.kpi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);padding:14px 16px}
.kpi small{display:block;font-size:13px;color:var(--mu)}
.kpi p{margin:4px 0 0;font-size:var(--f2);color:var(--mu)}
.big{font-size:40px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big em{font-style:normal;font-size:var(--f3);font-weight:600;color:var(--mu);margin-left:4px}
.status{font-size:var(--f2);border-radius:var(--r2);padding:10px 12px;background:var(--s1);border:1px solid var(--line);margin:12px 0 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.track{position:relative;display:grid;grid-template-columns:repeat(4,1fr);margin:6px 0 8px}
.track::before{content:"";position:absolute;left:12.5%;right:12.5%;top:50%;height:2px;background:var(--line)}
.track span{position:relative;justify-self:center;width:16px;height:16px;border-radius:50%;border:2px solid var(--ctl);background:var(--bg)}
.track span.on{background:var(--key);border-color:var(--key);box-shadow:0 0 0 5px var(--keyt)}
.trackl{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;font-size:var(--f1);color:var(--mu);line-height:1.4}
.trackl b{display:block;font-size:var(--f2)}
.trackl .on{color:var(--tx);font-weight:700}
.acts{list-style:none;margin:0;padding:0;display:grid;gap:8px}
@media (min-width:700px){.acts{grid-template-columns:repeat(3,minmax(0,1fr))}}
.acts li{background:var(--s1);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;font-size:var(--f2);color:var(--mu)}
.acts small{display:block;font-size:var(--f1);color:var(--key2);font-weight:700}
.acts b{display:block;color:var(--tx);font-size:15px;margin:2px 0 4px}
.rowb{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:16px 0 0}
details.how{border:1px solid var(--line);border-radius:var(--r2);margin:0 0 20px;background:var(--s1)}
details.how summary{cursor:pointer;padding:14px 16px;font-weight:700;list-style:none}
details.how summary::-webkit-details-marker{display:none}
details.how summary::before{content:"+";display:inline-block;width:20px;color:var(--key2)}
details.how[open] summary::before{content:"−"}
.howb{padding:0 16px 16px;font-size:var(--f2);color:var(--mu)}
.howb ol{padding-left:20px;margin:0}
.howb li{margin:0 0 14px}
.howb li>b{display:block;color:var(--tx)}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:5px 6px;text-align:left;font-weight:400}
.tbl thead th{font-weight:700}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.seg span{border:1px solid var(--line);border-radius:var(--r1);padding:2px 9px;font-size:var(--f1)}
.seg span.hit{background:var(--keyt);border-color:var(--key2);color:var(--tx);font-weight:800}

/* 한국 참여 현황 */
.dtop{display:grid;gap:10px;margin:0 0 6px}
@media (min-width:640px){.dtop{grid-template-columns:.8fr 1.2fr}}
.rows{background:var(--s1);border:1px solid var(--line);border-radius:var(--r3);padding:2px 16px;overflow:hidden}
.dtop .rows{display:flex;flex-direction:column;justify-content:center}
.drow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:var(--f2)}
.rows .drow:last-child{border-bottom:0}
.dl small{color:var(--mu);font-size:var(--f1);margin-left:6px}
.dl em{font-style:normal;font-size:11px;font-weight:800;background:var(--key);color:#fff;border-radius:6px;padding:0 6px;margin-left:6px}
.dv{font-weight:800;font-variant-numeric:tabular-nums;text-align:right}
.dt{grid-column:1/-1;height:8px;background:var(--s2);border-radius:4px;overflow:hidden}
.dt i{display:block;height:100%;width:0;background:var(--sub);border-radius:4px;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.drow.lock .dv{font-weight:600;color:var(--mu);font-size:13px}
.drow.lock .dv b{color:var(--tx)}
.drow.lock .dt i{background:repeating-linear-gradient(135deg,var(--ctl) 0 6px,var(--line) 6px 12px)}
.drow.me{background:var(--keyt);margin:0 -16px;padding:10px 16px}

const SLOT = ['A','A','B','B','C','C','D','D','E','E'];
const KIND = {3:'chat', 9:'repro'};
const IDK = -1; // 「모르겠어요」 - 점수는 놓친 것과 같다

/* ── 규칙(화면과 무관) ── */
const mean = a => a.reduce((x, y) => x + y, 0) / a.length;
const toks = it => it.lines.join(' ').match(/\[[^\]]+\]/g).map(x => x.slice(1, -1));
function levelFor(pos, rec){ return pos % 2 === 0 ? 'easy' : (rec[pos - 1] && rec[pos - 1].ok ? 'hard' : 'easy'); }
function pickItem(pos, rec, used){
 const lv = levelFor(pos, rec), kind = KIND[pos] || 'mc';
 const c = POOL.filter(x => x.d === SLOT[pos] && x.type === kind && !used.includes(x.id));
 return c.find(x => x.lv === lv) || c[0];
}
const pts = r => r.ok ? 100 : (r.it.lv === 'hard' ? 40 : 0);
function domScores(rec){
 const o = {};
 DK.forEach(k => { const r = rec.filter(x => x && x.it.d === k); o[k] = r.length ? Math.round(mean(r.map(pts))) : 0; });
 return o;
}
function stepOf(s){
 const avg = Math.round(mean(DK.map(k => s[k])));
 const base = avg < 40 ? 1 : avg < 65 ? 2 : avg < 85 ? 3 : 4;
 const cap = Math.min(s.A, s.B) < 60 ? 1 : s.C < 60 ? 2 : s.D < 60 ? 3 : 4;
 return {avg, base, cap, step: Math.min(base, cap)};
}
function plan(s){ // 점수가 낮은 영역 셋. 같은 점수면 윤리 · 비판적 판단부터
 return ['E','A','B','C','D'].sort((a, b) => s[a] - s[b]).slice(0, 3).map(k => ({k, deep: s[k] >= 70, act: ACTS[k][s[k] >= 70 ? 1 : 0]}));
}
function ncdf(z){ const t = 1 / (1 + 0.2316419 * Math.abs(z)); const p = 0.3989423 * Math.exp(-z * z / 2) * t * (0.3193815 + t * (-0.3565638 + t * (1.781478 + t * (-1.821256 + t * 1.330274)))); return z > 0 ? 1 - p : p; }
const ptile = (v, mu) => Math.max(1, Math.min(99, Math.round(ncdf((v - mu) / SD) * 100)));
const streakOf = rec => { let n = 0; for(let i = rec.length - 1; i >= 0 && rec[i] && rec[i].ok; i--) n++; return n; };
const minutesLeft = answered => Math.ceil((10 - answered) * 50 / 60);
function simulate(okAt){
 const rec = [], used = [];
 for(let p = 0; p < 10; p++){ const it = pickItem(p, rec, used); used.push(it.id); rec.push({it, ok: okAt(p, it)}); }
 return rec;
}

/* 자체 점검 - 규칙이 깨지면 콘솔에 실패가 뜬다 */

 console.assert(stepOf(sNone).avg === 0 && stepOf(sNone).step === 1, '다 놓치면 0 · L1');

/* ── 화면 공용 ── */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tx = s => String(s).replace(/ · /g, ', '); // 문항 안 가운데점 나열은 쉼표로 보인다(원문은 그대로)
const later = fn => RM ? fn() : requestAnimationFrame(() => requestAnimationFrame(fn));
const fmt = (v, dec) => dec ? (+v).toFixed(dec) : Math.round(v).toLocaleString('ko-KR');
function fmtTime(s){ const t = new Date(s); return isNaN(t) ? '-' : `${t.getMonth() + 1}월 ${t.getDate()}일 ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`; }
const say = msg => { $('#live').textContent = msg; };
const term = k => `<button type="button" class="term" data-term="${k}">${TERMS[k][0]}</button>`;
function showTip(btn){
 const k = btn.dataset.term, el = $('#tip'), r = btn.getBoundingClientRect();
 el.innerHTML = `<b>${TERMS[k][0]}</b>${TERMS[k][1]}`; el.hidden = false;
 const w = el.offsetWidth, left = Math.max(16, Math.min(innerWidth - w - 16, r.left + r.width / 2 - w / 2));
 el.style.left = left + scrollX + 'px'; el.style.top = r.bottom + scrollY + 8 + 'px';
}
const PREV = {};
function roll(el, from, to, dec){
 if(from === to){ el.textContent = fmt(to, dec); return; }
 const t0 = performance.now();
 const step = t => { const k = Math.min(1, (t - t0) / 900), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from) * e, dec); if(k < 1) requestAnimationFrame(step); };
 requestAnimationFrame(step);
}
const barAttr = (key, w) => `data-k="${esc(key)}" data-w="${Math.max(0, Math.min(100, w))}" style="width:${PREV[key] || 0}%"`;
const numHTML = (key, v, dec) => `<span data-k="${esc('#' + key)}" data-to="${v}" data-dec="${dec || 0}">${fmt(PREV['#' + key] || 0, dec)}</span>`;
function animate(root){
 later(() => {
  $$('[data-w]', root).forEach(el => { const w = +el.dataset.w; el.style.width = w + '%'; PREV[el.dataset.k] = w; });
  $$('[data-to]', root).forEach(el => { const k = el.dataset.k, to = +el.dataset.to, from = PREV[k] || 0; PREV[k] = to; roll(el, from, to, +el.dataset.dec); });
 });
}

/* ── AI 구체: 입자 구체 + 빛 고리와 유체. 말할 때 밝아지고, 기다릴 때 잔잔하고, 맞히면 번쩍, 틀리면 흩어졌다 모인다.
      마우스를 올리면 커서 주변 입자가 밀려 흩어졌다 스프링처럼 돌아오고, 누르면 그 자리에서 한 번 퍼진다 ── */
class Orb {
 constructor(){
  this.c = document.createElement('canvas'); this.c.className = 'orb'; this.c.setAttribute('aria-hidden', 'true');
  this.g = this.c.getContext('2d'); this.t = 0; this.fl = 0; this.last = 0; this.d = 1;
  this.p = {e: .2, g: .45, s: 0}; this.set('idle');
  this.pts = [];
  for(let i = 0; i < 2200; i++){ const y = 1 - 2 * Math.random(), r = Math.sqrt(1 - y * y), th = Math.random() * 6.2832, sh = 1 + (Math.random() - .5) * .06; this.pts.push([Math.cos(th) * r * sh, y * sh, Math.sin(th) * r * sh, Math.random()]); }
  this.off = new Float32Array(this.pts.length * 4); // 입자마다 밀려난 거리(x, y)와 속도(vx, vy), 캔버스 픽셀 단위
  this.ptr = null; this.boom = null; this.hov = 0;
  const at = e => { const r = this.c.getBoundingClientRect(); return {x: (e.clientX - r.left) * this.d, y: (e.clientY - r.top) * this.d}; };
  this.c.addEventListener('pointermove', e => { this.ptr = at(e); });
  this.c.addEventListener('pointerdown', e => { this.ptr = at(e); this.boom = at(e); });
  ['pointerleave', 'pointercancel'].forEach(n => this.c.addEventListener(n, () => { this.ptr = null; }));
  this.c.addEventListener('pointerup', e => { if(e.pointerType !== 'mouse') this.ptr = null; });
  new ResizeObserver(() => this.fit()).observe(this.c);
  requestAnimationFrame(ts => this.loop(ts));
 }
 fit(){ const d = Math.min(2, devicePixelRatio || 1); this.d = d; this.c.width = Math.round(this.c.clientWidth * d); this.c.height = Math.round(this.c.clientHeight * d); }
 set(m){ this.tp = {idle:{e:.15,g:.45,s:0}, speak:{e:1,g:.95,s:0}, listen:{e:.3,g:.6,s:0}, happy:{e:.7,g:1.3,s:0}, think:{e:.2,g:.4,s:.45}}[m] || this.tp; }
 flash(){ this.fl = 1; }
 loop(ts){
  requestAnimationFrame(t => this.loop(t));
  const dt = Math.min(.05, (ts - this.last) / 1000 || 0); this.last = ts;
  if(!RM) this.t += dt;
  const ease = RM ? 1 : .06; // 움직임을 끄면 빛 세기도 목표값으로 바로 맞춰 화면이 완전히 멈춘다
  for(const k in this.p) this.p[k] += (this.tp[k] - this.p[k]) * ease;
  this.fl = RM ? 0 : this.fl * .94;
  this.hov = RM ? 0 : this.hov + ((this.ptr ? 1 : 0) - this.hov) * .08;
  const g = this.g, W = this.c.width, H = this.c.height, d = this.d, t = this.t, p = this.p;
  if(!W || !H) return;
  g.clearRect(0, 0, W, H);
  const glow = Math.min(1.6, p.g + this.fl * .8 + this.hov * .25);
  const cx = W / 2, cy = H / 2, R = Math.min(W, H) * .31 * (1 + .02 * Math.sin(t * 1.3) + .035 * p.e * Math.sin(t * 7.5));
  g.globalCompositeOperation = 'lighter';
  const gr = g.createRadialGradient(cx, cy, R * .2, cx, cy, R * 1.9);
  gr.addColorStop(0, `rgba(106,85,245,${.38 * glow})`); gr.addColorStop(.55, `rgba(70,50,210,${.12 * glow})`); gr.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
  g.save(); g.beginPath(); g.arc(cx, cy, R * .94, 0, 7); g.clip();
  [[217,70,239],[106,85,245],[110,231,249]].forEach((c, k) => {
   const bx = cx + Math.cos(t * .7 + k * 2.1) * R * .38, by = cy + Math.sin(t * .9 + k * 2.3) * R * .38;
   const b = g.createRadialGradient(bx, by, 0, bx, by, R * .85);
   b.addColorStop(0, `rgba(${c},${.55 * glow})`); b.addColorStop(1, `rgba(${c},0)`);
   g.fillStyle = b; g.fillRect(cx - R, cy - R, R * 2, R * 2);
  });
  g.restore();
  for(let k = 0; k < 3; k++){

function pctHTML(){
 const a = AGG, min = (a && a.minCell) || 30, label = `<small>${term('pct')}${a && a.total && a.total.mean != null ? ' (추정)' : ''}</small>`;
 if(!(a && a.total && a.total.mean != null && a.n >= min))
  return `${label}<p>참여자가 ${min}명을 넘으면 백분위가 열립니다.${a ? ` 지금 ${fmt(a.n)}명이 참여했습니다.` : ''}</p>`;
 const job = a.byJob && a.byJob[RES.job], same = job && job.mean != null;
 const p = ptile(RES.total, same ? job.mean : a.total.mean);
 return `${label}<div class="big">${numHTML('me-pct', p)}</div><p>${same ? `같은 직무(${esc(RES.job)}) 참여자 100명 가운데 약 ${p}명보다 높습니다.` : `전국 참여자 100명 가운데 약 ${p}명보다 높습니다. 같은 직무는 ${min}명이 모이면 따로 봅니다.`}${p < 30 ? ' 지금 시작하는 분이 가장 많이 오르는 구간입니다. 아래 30일 할 일부터 해 보세요.' : ''}</p>`;
}

function copyLink(){

function newId(){ const cs = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-', b = new Uint8Array(20); crypto.getRandomValues(b); return Array.from(b, x => cs[x % 64]).join(''); }
function clientId(){
 try { let v = localStorage.getItem('aiUseIndexClientId'); if(!/^[A-Za-z0-9_-]{20}$/.test(v || '')){ v = newId(); localStorage.setItem('aiUseIndexClientId', v); } return v; }
 catch(e){ return newId(); }
}

let AGG = null, AGG_FAIL = false;
const FAKE = {n: 137, sum: 137 * 61.2, dom: {A: 68.4, B: 64.1, C: 57.9, D: 49.6, E: 66.0},
 job: {'경영 · 사무': [41, 62.4], '영업 · 마케팅': [23, 58.9], '연구 · 개발': [31, 68.1], 'IT': [18, 71.0], '생산 · 기술': [9, 51.3], '서비스 · 고객 응대': [7, 49.8], '교육 · 공공': [6, 57.5], '기타': [2, 55.0]},
 ind: {'제조': [38, 60.2], 'IT · 통신': [34, 69.4], '금융 · 보험': [22, 63.0], '유통 · 서비스': [17, 56.1], '공공 · 교육': [14, 58.8], '건설 · 에너지': [8, 50.5], '기타': [4, 54.0]}};
function fakeAgg(){
 const cell = (n, m) => ({n, mean: n >= 30 ? Math.round(m * 10) / 10 : null});
 const grp = g => Object.fromEntries(Object.entries(g).map(([k, v]) => [k, cell(v[0], v[1])]));
 return {n: FAKE.n, minCell: 30, total: cell(FAKE.n, FAKE.sum / FAKE.n), byDomain: Object.fromEntries(DK.map(k => [k, cell(FAKE.n, FAKE.dom[k])])),
  byJob: grp(FAKE.job), byIndustry: grp(FAKE.ind), updatedAt: new Date().toISOString()};
}
function fakeSubmit(p){
 if(p.website) return {ok: true};
 const add = (g, k) => { const c = g[k] || (g[k] = [0, 0]); c[1] = (c[1] * c[0] + p.total) / (c[0] + 1); c[0]++; };
 DK.forEach(k => { FAKE.dom[k] = (FAKE.dom[k] * FAKE.n + p.scores[k]) / (FAKE.n + 1); });
 FAKE.n++; FAKE.sum += p.total; add(FAKE.job, p.job); add(FAKE.ind, p.industry);
 return {ok: true};
}
function refreshAgg(){
 const req = DEMO ? Promise.resolve(fakeAgg()) : fetch(DATA_ENDPOINT).then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
 return req.then(a => { if(!a || typeof a.n !== 'number') throw new Error('shape'); AGG = a; AGG_FAIL = false; })
  .catch(() => { AGG_FAIL = true; })
  .then(() => {
   const h = $('#hero-n'); if(h && AGG){ h.innerHTML = numHTML('hero-n', AGG.n); animate(h); }
   fillDash(); updateResultAgg();
  });
}
function row(key, label, c, min, me){
 c = c || {n: 0, mean: null};
 const n = c.n || 0, lock = c.mean == null;
 return `<div class="drow${lock ? ' lock' : ''}${me ? ' me' : ''}"><span class="dl">${label}${me ? '<em>나</em>' : ''}<small>${fmt(n)}명</small></span>
  <span class="dv">${lock ? `공개까지 <b>${Math.max(0, min - n)}</b>명 남음` : numHTML(key, c.mean, 1)}</span>
  <div class="dt"${lock ? ` role="progressbar" aria-label="${esc('공개까지 ' + n + ' / ' + min + '명')}" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${min}"` : ''}><i ${barAttr(key, lock ? n / min * 100 : c.mean)}></i></div></div>`;
}
function group(kind, list, obj, min, mine){ // 공개된 칸만 줄로, 공개 전 칸은 한 줄로 묶는다
 const open = list.filter(v => obj && obj[v] && obj[v].mean != null), shut = list.filter(v => !open.includes(v));
 return (open.length ? `<div class="rows">${open.map(v => row(kind + '-' + v, esc(v), obj[v], min, v === mine)).join('')}</div>` : '')
  + (shut.length ? `<p class="locked"><b>공개 전 ${shut.length}칸</b>${shut.map(v => `<span class="${v === mine ? 'me' : ''}">${esc(v)} ${Math.max(0, min - ((obj && obj[v] && obj[v].n) || 0))}명 남음${v === mine ? ' (나)' : ''}</span>`).join('')}</p>` : '');
}

 const tm = t.closest('[data-term]'); if(tm){ showTip(tm); return; }
 if(!t.closest('#tip')) $('#tip').hidden = true;
 const p = t.closest('#qbody [data-pick]'); if(p){ qPick(+p.dataset.pick); return; }
 const b = t.closest('[data-act]');
 if(!b){ if(TYPING && t.closest('#stage')) TYPING(); return; } // 무대를 누르면 말하던 문장을 바로 끝낸다
 const a = b.dataset.act;
 if(a === 'start') jobView();
 else if(a === 'chip'){
  S[b.dataset.f] = b.dataset.v;
  $$('.chip').forEach(x => x.setAttribute('aria-pressed', x === b));
  ORB.flash(); clearT();
  T.push(setTimeout(b.dataset.f === 'job' ? indView : consentView, RM ? 0 : 380));
 }
 else if(a === 'back') VIEW === 'prep' && $('#agree') ? indView() : jobView();
 else if(a === 'begin'){
  if(!$('#agree').checked){ $('#err').hidden = false; $('#agree').focus(); return; }
  S.agree = true; begin();
 }
 else if(a === 'toq') qShow();
 else if(a === 'next'){ if(S.pos < 9){ S.pos++; S.pos % 2 === 0 ? domainView() : qShow(); } else finish(); }
 else if(a === 'resend') send();
 else if(a === 'save') saveImage();
 else if(a === 'copy') copyLink();
 else if(a === 'dash') dashView();
 else if(a === 'undash') DASH_FROM === 'result' && RES ? renderResult() : startView();
 else if(a === 'home'){ RES = null; startView(); }
 else if(a === 'brand'){ // 왼쪽 위 로고: 처음 화면으로. 문항을 푸는 중이면 한 번 묻는다
  if((VIEW === 'q' || VIEW === 'domain') && !confirm('풀던 문항은 저장되지 않습니다. 처음 화면으로 갈까요?')) return;
  RES = null; startView();
 }
 else if(a === 'motion'){ RM = !RM; try { localStorage.setItem('aiIndexMotion', RM ? 'off' : 'on'); } catch(err){} if(RM && TYPING) TYPING(); syncMotion(); }
});
document.addEventListener('change', e => { if(e.target.id === 'agree'){ S.agree = e.target.checked; if(S.agree) $('#err').hidden = true; } });
document.addEventListener('keydown', e => {
 const inField = e.target.closest && e.target.closest('input,textarea,select,[contenteditable]');
 if(TYPING && (e.key === 'Enter' || e.key === ' ') && !inField){ e.preventDefault(); TYPING(); return; }
 if(e.key === 'Escape'){ $('#tip').hidden = true; return; }
 if(inField || e.ctrlKey || e.metaKey || e.altKey) return;
 if(VIEW === 'q' && S.cur && !S.rec[S.pos] && S.cur.type !== 'repro'){
  const k = 'abcd'.indexOf(e.key.toLowerCase()), btn = k >= 0 && $(`#qbody [data-pick="${k}"]`);
  if(btn && btn.offsetParent && getComputedStyle(btn.closest('.after') || btn).visibility !== 'hidden'){ btn.click(); return; }
 }
 if(e.key === 'Enter' && (e.target === document.body || e.target.id === 'say')){
  const p = $('#view [data-primary]'); if(p && p.offsetParent){ e.preventDefault(); p.click(); }
 }
});

function syncMotion(){ // 움직임 켜고 끄기: CSS 애니메이션(html.still), 지형 SVG 흐름, 버튼 글자를 함께 맞춘다
 document.documentElement.classList.toggle('still', RM);
 const b = $('[data-act="motion"]'); b.setAttribute('aria-pressed', RM); b.textContent = RM ? '움직임 켜기' : '움직임 끄기';
 $$('svg').forEach(s => { if(s.pauseAnimations) RM ? s.pauseAnimations() : s.unpauseAnimations(); });
}
syncMotion();
startView();
refreshAgg();
setInterval(() => { if(document.visibilityState === 'visible' && ['start', 'result', 'dash'].includes(VIEW)) refreshAgg(); }, 30000);
})();
</script>
